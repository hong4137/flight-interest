name: command

# 텔레그램으로 받은 명령을 config/search.yaml 에 반영한다.
#
# Cloudflare Worker(worker/) 가 텔레그램 웹훅을 받아 repository_dispatch 로
# 넘겨준다. 조회 명령은 Worker 가 즉시 답하고, 값을 바꾸는 명령만 여기로 온다.
#
# schedule 이 없는 이유: 텔레그램은 웹훅과 getUpdates 를 동시에 쓸 수 없다.
# 웹훅이 걸려 있으면 폴링은 409 를 받는다. 웹훅을 떼고 폴링으로 돌아가려면
# worker/README.md 의 "되돌리기" 를 참고해 아래 schedule 을 되살린다.
#
#   schedule:
#     - cron: "*/10 * * * *"

on:
  repository_dispatch:
    types: [telegram-command]
  workflow_dispatch:
    inputs:
      text:
        description: "처리할 명령 (비우면 getUpdates 로 밀린 것을 가져옴)"
        required: false
      chat_id:
        description: "text 와 함께 쓸 대화 id"
        required: false
      publish_menu:
        description: "봇 명령 자동완성 목록도 갱신"
        type: boolean
        default: false

concurrency:
  group: flight-command
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  command:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 명령 처리
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          PYTHONIOENCODING: utf-8
          # 웹훅 경로와 수동 실행 경로 둘 다 받는다.
          CMD_TEXT: ${{ github.event.client_payload.text || inputs.text }}
          CMD_CHAT: ${{ github.event.client_payload.chat_id || inputs.chat_id }}
          PUBLISH_MENU: ${{ inputs.publish_menu }}
        run: |
          ARGS=""
          if [ "$PUBLISH_MENU" = "true" ]; then
            ARGS="$ARGS --publish-menu"
          fi
          if [ -n "$CMD_TEXT" ]; then
            python -m src.main commands $ARGS --text "$CMD_TEXT" --chat-id "$CMD_CHAT"
          else
            python -m src.main commands $ARGS
          fi

      - name: 변경 커밋
        run: |
          git config user.name "flight-watch[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 스윕이 쓰는 state.json / history.csv 는 건드리지 않는다. 겹치면 충돌한다.
          git add config/search.yaml data/telegram.json
          if git diff --staged --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "chore(config): 텔레그램 명령 반영 [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              echo "푸시 완료 (시도 $attempt)"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::warning::변경 푸시에 실패했습니다."
