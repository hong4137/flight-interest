name: digest

on:
  schedule:
    # 00:00 UTC = 09:00 KST
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: flight-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 일일 요약 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          PYTHONIOENCODING: utf-8
        run: python -m src.main digest

      - name: 상태 커밋
        run: |
          git config user.name "flight-watch[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && exit 0
          git commit -m "chore(state): daily digest [skip ci]"
          # 1회용 교체 파일 삭제가 여기서 커밋된다. 푸시가 실패하면 원격에 파일이
          # 남아 다음 날 같은 글이 또 나가므로 재시도한다.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash && git push; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo "::warning::상태 푸시 실패"
