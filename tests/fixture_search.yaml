# 테스트 전용 고정 설정.
#
# 테스트가 config/search.yaml 을 읽으면, 사용자가 텔레그램으로 목표가나 날짜를
# 바꿀 때마다 테스트가 깨진다. 실제 운영 설정과 테스트를 분리한다.
# 값은 2026-08-23 최초 설정과 같다.

trip:
  origin: ICN
  outbound_dates: {start: 2027-01-02, end: 2027-01-06}
  arrive_korea: {start: 2027-01-16, end: 2027-01-20}
  return_search_pad_days: 2
  # 2026-08-23 실측: BLQ·NAP·VLC·AGP 는 인천발/착 비즈니스 경유1회 노선이
  # 양방향 모두 0건이었다. (주석 보존을 확인하는 테스트가 이 줄을 본다)
  entry_airports:
    IT: [FCO, MXP, VCE]        # 제외: BLQ, NAP
    ES: [BCN, MAD]             # 제외: VLC, AGP
    PT: [LIS, OPO]
  exit_airports: same_as_entry
  allow_open_jaw: true

search:
  cabin: business
  max_stops: 1
  passengers: 2
  currency: KRW
  language: ko
  hide_separate_and_self_transfer: true

threshold:
  per_person_krw: 3000000
  ow_to_rt_ratio: 0.70
  ow_to_openjaw_ratio: 0.80
  t2_margin: 1.25
  new_low_alert_drop_pct: 5

alerting:
  duplicate_cooldown_hours: 24
  digest_top_n: 5
  dashboard_url: "https://hong4137.github.io/flight-interest/"

budget:
  serpapi_monthly_cap: 240
  serpapi_daily_cap: 8
  serpapi_warn_at_pct: 20
  serpapi_per_sweep_cap: 2

runtime:
  request_jitter_seconds: [2.5, 4.5]
  request_timeout_seconds: 30
  max_retries: 3
  empty_retries: 2
  hot_roundtrip_count: 8
  hot_openjaw_count: 4
  full_confirm_count: 30
  fail_rate_alert_threshold: 0.35
